<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Request Forms · Plei Hub</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .rf-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
  .rf-tab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--txt);border-radius:10px;padding:9px 14px;font-size:13.5px;font-weight:600;cursor:pointer}
  .rf-tab .ic{width:22px;height:22px;margin:0;border-radius:6px}
  .rf-tab.on{border-color:var(--green);background:rgba(47,215,113,.1);color:var(--green-soft)}
  .rf-panel{max-width:640px;background:linear-gradient(180deg,#0e3626,#0b2c1f);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
  .rf-panel h2{margin:0 0 3px;font-size:18px}
  .rf-panel .rf-sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .rf-field{margin:0 0 14px}
  .rf-field label{display:block;font-size:12.5px;font-weight:600;color:var(--green-soft);margin:0 0 5px}
  .rf-field input,.rf-field textarea,.rf-field select{width:100%;box-sizing:border-box;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--txt);font:inherit;font-size:13.5px}
  .rf-field input:focus,.rf-field textarea:focus,.rf-field select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 2px rgba(47,215,113,.15)}
  .rf-field textarea{resize:vertical;min-height:74px}
  .rf-row{display:flex;gap:12px;flex-wrap:wrap}
  .rf-row .rf-field{flex:1;min-width:180px}
  .rf-submit{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#062018;font-weight:700;border:none;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;margin-top:4px}
  .rf-submit:hover{background:#59e08c}
  .rf-note{font-size:12px;color:var(--muted);margin:14px 0 0}
</style>
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="logo" href="index.html"><img src="logo-green.png" alt="Plei" style="width:26px;height:26px;vertical-align:middle" />plei<span class="dot">.</span></a>
      <a class="link" href="index.html">Home</a>
      <a class="link" href="okrs.html">OKRs</a>
      <a class="link" href="hr.html">HR</a>
      <span class="spacer"></span><span class="badge">Resources</span>
    </nav>

    <h1>Request <span class="g">forms</span></h1>
    <p class="sub">Pick a request type, fill it out, and send. Each one routes to the team that owns it. Clean intake, no ClickUp.</p>

    <div class="rf-tabs" id="rfTabs"></div>
    <div id="rfPanel"></div>

    <footer><a href="index.html" style="color:var(--green);text-decoration:none">← Back to home</a></footer>
  </div>

<script>
// Each request type: owner inbox + fields. Submitting composes a structured request to the owner. Repoint
// "to" (or swap the submit action) to Linear when that's set up — the field structure is ready to map over.
var FORMS = {
  coi: {
    label: "COI / Insurance", icon: "shield",
    title: "Certificate of Insurance request",
    sub: "Facility or partner certificate of insurance. Processing is 1–3 business days.",
    to: "insurance@plei.com",
    fields: [
      {k:"Requester name", t:"text", req:true},
      {k:"Requester email", t:"email", req:true},
      {k:"Facility / Partner name", t:"text", req:true},
      {k:"Facility address", t:"text"},
      {k:"Event date", t:"date"},
      {k:"Needed by", t:"date", req:true},
      {k:"Additional insured needed", t:"select", opts:["No","Yes"]},
      {k:"Details / special wording", t:"textarea"}
    ]
  },
  design: {
    label: "Design", icon: "pen",
    title: "Design request",
    sub: "Creative and brand assets for marketing, social, and events.",
    to: "design@plei.com",
    fields: [
      {k:"Requester name", t:"text", req:true},
      {k:"Requester email", t:"email", req:true},
      {k:"What do you need", t:"text", req:true},
      {k:"Type", t:"select", opts:["Social","Print","Presentation","Web","Other"]},
      {k:"Due date", t:"date", req:true},
      {k:"Details, copy, and links", t:"textarea", req:true}
    ]
  },
  comms: {
    label: "Comms / PR", icon: "mic",
    title: "Comms / PR request",
    sub: "Press, announcements, and communications support.",
    to: "comms@plei.com",
    fields: [
      {k:"Requester name", t:"text", req:true},
      {k:"Requester email", t:"email", req:true},
      {k:"Request type", t:"select", opts:["Press / media","Announcement","Social","Other"]},
      {k:"Headline / topic", t:"text", req:true},
      {k:"Timing", t:"date"},
      {k:"Details and context", t:"textarea", req:true}
    ]
  },
  it: {
    label: "IT / Access", icon: "key",
    title: "IT / Access request",
    sub: "Accounts, tools, and access changes.",
    to: "it@plei.com",
    fields: [
      {k:"Requester name", t:"text", req:true},
      {k:"Requester email", t:"email", req:true},
      {k:"System / tool", t:"text", req:true},
      {k:"Action", t:"select", opts:["Grant access","Revoke access","New account","Other"]},
      {k:"Urgency", t:"select", opts:["Normal","Urgent"]},
      {k:"Reason", t:"textarea", req:true}
    ]
  },
  eng: {
    label: "Engineering", icon: "code",
    title: "Engineering request",
    sub: "Bugs, features, and infrastructure asks for the engineering team.",
    to: "engineering@plei.com",
    fields: [
      {k:"Requester name", t:"text", req:true},
      {k:"Requester email", t:"email", req:true},
      {k:"Request type", t:"select", opts:["Bug","Feature","Infrastructure","Data / report","Other"]},
      {k:"Title / summary", t:"text", req:true},
      {k:"Priority", t:"select", opts:["Low","Normal","High","Urgent"]},
      {k:"Details, steps to reproduce, links", t:"textarea", req:true}
    ]
  },
  product: {
    label: "Product", icon: "cube",
    title: "Product request",
    sub: "Feature ideas, changes, and product feedback.",
    to: "product@plei.com",
    fields: [
      {k:"Requester name", t:"text", req:true},
      {k:"Requester email", t:"email", req:true},
      {k:"Area", t:"select", opts:["App","Marketplace","Growth","Organizer tools","Other"]},
      {k:"Title / summary", t:"text", req:true},
      {k:"Priority", t:"select", opts:["Low","Normal","High","Urgent"]},
      {k:"Problem, goal, and context", t:"textarea", req:true}
    ]
  }
};
var ICONS = {
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V7l8-4z"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3zM18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 013 3v6a3 3 0 01-6 0V5a3 3 0 013-3zM19 10a7 7 0 01-14 0M12 19v3"/></svg>',
  key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 7a4 4 0 110 8 4 4 0 010-8zM11 11L3 19M7 15l2 2"/></svg>',
  code:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>',
  cube:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7l9-5zM3 7l9 5 9-5M12 12v10"/></svg>'
};
var order = ["coi","design","comms","it","eng","product"];
var tabs = document.getElementById("rfTabs"), panel = document.getElementById("rfPanel"), cur = "coi";

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

function renderTabs(){
  tabs.innerHTML = order.map(function(k){ var f=FORMS[k];
    return '<button class="rf-tab '+(k===cur?"on":"")+'" data-k="'+k+'"><span class="ic">'+ICONS[f.icon]+'</span>'+esc(f.label)+'</button>';
  }).join("");
}
function renderPanel(){
  var f = FORMS[cur];
  var rows = f.fields.map(function(fl){
    var lab = esc(fl.k) + (fl.req?' <span style="color:#f28b82">*</span>':'');
    var inp;
    if(fl.t==="textarea") inp = '<textarea data-k="'+esc(fl.k)+'" '+(fl.req?"data-req":"")+'></textarea>';
    else if(fl.t==="select") inp = '<select data-k="'+esc(fl.k)+'">'+fl.opts.map(function(o){return '<option>'+esc(o)+'</option>';}).join("")+'</select>';
    else inp = '<input type="'+fl.t+'" data-k="'+esc(fl.k)+'" '+(fl.req?"data-req":"")+' />';
    return '<div class="rf-field"><label>'+lab+'</label>'+inp+'</div>';
  }).join("");
  panel.innerHTML =
    '<div class="rf-panel"><h2>'+esc(f.title)+'</h2><p class="rf-sub">'+esc(f.sub)+'</p>'+
    rows +
    '<button type="button" class="rf-submit" id="rfSend"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#062018" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>Submit request</button>'+
    '<p class="rf-note">Routes to '+esc(f.to)+'. This will connect to Linear once it\'s set up.</p></div>';
}
tabs.addEventListener("click", function(e){ var b=e.target.closest(".rf-tab"); if(!b) return; cur=b.getAttribute("data-k"); renderTabs(); renderPanel(); });
panel.addEventListener("click", function(e){
  if(!e.target.closest("#rfSend")) return;
  var f = FORMS[cur], miss=[], lines=[];
  panel.querySelectorAll("[data-k]").forEach(function(el){
    var k=el.getAttribute("data-k"), v=(el.value||"").trim();
    if(el.hasAttribute("data-req") && !v) miss.push(k);
    lines.push(k+": "+(v||"—"));
  });
  if(miss.length){ alert("Please fill in: "+miss.join(", ")); return; }
  var subject = "["+f.label+" request] "+f.title;
  var body = lines.join("\n") + "\n\n— Submitted from the Plei Hub";
  window.location.href = "mailto:"+f.to+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
});
renderTabs(); renderPanel();
</script>
</body>
</html>
